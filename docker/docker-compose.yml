services:
  proposta-db:
    image: postgres:16
    container_name: proposta-db
    environment:
      POSTGRES_DB: proposta_db
      POSTGRES_USER: proposta
      POSTGRES_PASSWORD: proposta
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proposta -d proposta_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  contratacao-db:
    image: postgres:16
    container_name: contratacao-db
    environment:
      POSTGRES_DB: contratacao_db
      POSTGRES_USER: contratacao
      POSTGRES_PASSWORD: contratacao
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contratacao -d contratacao_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
